name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint + typecheck + hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The CHANGELOG check below diffs a pull request against its base,
          # which needs the merge base in the clone.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # test/ is excluded from tsconfig.json (which builds only src/), so
      # without this the suite had no type checking in CI at all.
      - run: npm run typecheck:test
      # Compile-time assertions about the *public* type surface
      # (test/types/*.test-d.ts) — a widened or narrowed signature fails here.
      - run: npm run typecheck:types
      # Unused exports / files / dependencies, and dependencies that are
      # imported but not declared. Both were wired up as scripts but never
      # run in CI, so they only ever caught what someone remembered to run
      # locally.
      - run: npm run unused
      - run: npm run depcheck
      # The generated API reference under docs/ is committed. Regenerate
      # and fail if it drifted from the source — a doc comment edited
      # without re-running `npm run docs` otherwise ships stale docs.
      - run: npm run docs
      - run: git diff --exit-code --ignore-cr-at-eol -- docs
      # Every TypeScript sample in README, the guide and
      # the changelog is compiled against src/. Names in the docs were already
      # checked; a name is not a signature, so a snippet calling a real method
      # the wrong way used to pass.
      - run: npm run check:docs
      # Duplicated source. Wired up as a script long before it ran in CI.
      - run: npm run cpd
      # Workflow syntax, expression types and — through shellcheck — the
      # shell in every `run:` block of every workflow here. The image is
      # pinned by digest, as every action in this repo is pinned by SHA.
      - name: Lint workflows (actionlint)
        run: docker run --rm -v "${PWD}:/repo" -w /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color # v1.7.12
      # A change under src/ must come with a CHANGELOG entry. Pull requests
      # only: a push to main has no base to diff against. Dependabot touches
      # package.json and the lockfile, never src/, so it passes.
      - name: CHANGELOG entry for source changes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${BASE_REF}"
          changed="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          if grep -q '^src/' <<< "${changed}" && ! grep -q '^CHANGELOG\.md$' <<< "${changed}"; then
            echo "::error::src/ changed without a CHANGELOG.md entry under [Unreleased]."
            exit 1
          fi

  peer-floors:
    name: peer dependency floors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # The declared peer ranges are a promise. The lockfile installs newer
      # versions than the ranges' floors, so nothing else here proves the
      # floors: install every peer at the lowest version its range admits,
      # then type-check and run the unit tier against it. A floor that was
      # never published, or an API this code uses that the floor lacks,
      # fails here rather than on the consumer who pinned it.
      # The floor of each range is computed by scripts/peer-floors.mjs, which
      # refuses a range it cannot reduce to one version rather than degrading
      # to "install whatever npm resolves" — which is what the previous inline
      # `replace(/^[\^~]/)` did for a `>=`, an x-range or a `||` union, leaving
      # the job green having proved nothing. One spec per line, read with
      # mapfile, so no spec can be split on a space.
      #
      # The script's output is captured into a variable first and only then
      # split. Read through a process substitution — `mapfile < <(…)` — its
      # exit status never reaches bash, `set -e` or not: a refusal left
      # `floors` empty, `npm install --no-save` and `npm ls` with no arguments
      # both succeeded, and the job went green against the lockfile's versions,
      # which is the outcome the script's refusal exists to prevent. An empty
      # answer is refused too, for a script that exits 0 having printed nothing.
      - name: Install every declared peer at its floor
        run: |
          set -euo pipefail
          specs="$(npm run --silent peer-floors)"
          mapfile -t floors <<<"${specs}"
          if [ -z "${floors[0]}" ]; then
            echo "::error::scripts/peer-floors.mjs named no floor to install; this job would prove nothing."
            exit 1
          fi
          printf 'installing %s\n' "${floors[@]}"
          npm install --no-save "${floors[@]}"
          # No `|| true`: this is the check that the floors actually resolved,
          # and swallowing it was swallowing the one signal the job produces.
          npm ls --depth=0 "${floors[@]%@*}"
      - run: npm run typecheck
      - run: npm run typecheck:test
      - run: npm run typecheck:types
      # The unit tier, minus one file. `dependency-citations.test.ts` checks that
      # every version, file and line this package cites is true of the
      # dependency *as installed* — and what is installed here is, on purpose,
      # not the version those citations were read at. Run in this job, it
      # forced the lockfile's version, the cited version and the floor to be
      # one version: every SDK bump then had to raise the floor, and raising a
      # floor is a major. The citations are checked where they can be true — in
      # the matrix below, at the lockfile's version — and the floor is free to
      # stay where the code needs it.
      #
      # `--testPathIgnorePatterns` on the command line replaces the configured
      # list rather than adding to it, so the live tier is named again.
      - run: npm test -- --ci --testPathIgnorePatterns test/integration/ dependency-citations

  test:
    name: test (node ${{ matrix.node }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 22 is the supported floor (engines.node), 24 is Active LTS, and 26
        # is Current — it shipped 2026-09-16 and becomes Active LTS while this
        # package is still 1.x, so it is tested before users are on it.
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test -- --ci
      - run: npm run build

  package-smoke:
    name: package smoke (pack + lint + install + import)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      # The tarball's shape, as a resolver sees it: the file listing (both
      # module trees, no declaration maps, nothing stray), publint, and
      # arethetypeswrong resolving the `exports` map from ESM, CommonJS and
      # bundler consumers — a `require` condition that silently lands on an
      # ES module fails here.
      - run: npm run pack:check
      # `npm pack`s, installs the tarball into a fresh project and uses the
      # public API from it: `import`, `require`, and a TypeScript 5 consumer
      # type-checked against the shipped declarations — the only check that
      # exercises the package as a consumer sees it, rather than as the
      # repo's own TypeScript program does.
      - run: npm run test:package-smoke

  audit:
    name: npm audit (high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # No `--omit=dev`: this package has no runtime `dependencies` at all
      # — `@aws-sdk/client-s3vectors` and `@langchain/core` are peers,
      # installed here via devDependencies. With `--omit=dev` the audit
      # therefore had an empty tree and passed unconditionally.
      - run: npm audit --audit-level=high
